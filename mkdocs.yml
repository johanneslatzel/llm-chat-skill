site_name: LLM Chat Skill
site_url: https://johanneslatzel.github.io/llm-chat-skill/
repo_url: https://github.com/johanneslatzel/llm-chat-skill
theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
plugins:
  - search
nav:
  - Overview: index.md
  - Quick start: examples/quick-start.md
  - Tools:
      - tools/index.md
      - load_skill: tools/load-skill.md
      - set_skill: tools/set-skill.md
      - delete_skill: tools/delete-skill.md
      - get_skill_resource: tools/get-skill-resource.md
      - set_skill_resource: tools/set-skill-resource.md
      - delete_skill_resource: tools/delete-skill-resource.md
      - search_resources: tools/search-resources.md
      - list_resources: tools/list-resources.md
  - Packages: packages.md
  - Registry:
      - registry/index.md
      - Configuration: registry/configuration.md
      - Skill file format: registry/skill-format.md
  - Environment variables: env.md
  - Architecture: architecture.md
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
